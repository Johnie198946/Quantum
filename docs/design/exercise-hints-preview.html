<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>混合练习 · 提示交互预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#eff2f0;color:#10213c;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;line-height:1.6}main{max-width:430px;margin:auto;padding:24px 20px 36px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}h1{font-size:20px;margin:0}header span{font-size:14px;color:#71819b}.card{background:white;border-radius:24px;padding:20px;box-shadow:0 10px 28px #526a7914}.meta{display:flex;justify-content:space-between;gap:12px;font-size:14px}.meta strong{color:#438ff2}.muted{color:#71819b;font-size:13px}h2{font-size:18px;line-height:1.7;font-weight:500;margin:16px 0}hr{border:0;border-top:1px solid #e5e8ee;margin:20px 0}fieldset{border:0;padding:0;margin:0}legend{font-weight:600;margin-bottom:12px}.choice{display:flex;gap:12px;align-items:center;min-height:54px;border:1px solid #dce1e8;border-radius:12px;padding:12px;margin-bottom:10px}.choice:has(input:checked){background:#f0f6ff;border-color:#438ff2}input{accent-color:#438ff2;width:18px;height:18px}.hint{margin-top:20px;background:#438ff20f;border-radius:12px;padding:12px}.hint button{width:100%;min-height:44px;border:0;background:none;display:flex;align-items:center;gap:8px;color:#10213c;font-size:15px;font-weight:600;text-align:left;cursor:pointer;padding:0}.hint button svg{width:19px;height:19px;flex:none}.hint button .chevron{margin-left:auto}.hint p{margin:8px 0;font-size:15px}.hint .note{font-size:12px;color:#10213cbf;margin-bottom:0}.hint button:focus-visible{outline:2px solid #438ff2;outline-offset:4px}.preview{font-size:12px;color:#71819b;margin-top:24px}.status{margin-top:18px;font-size:13px;color:#71819b}button{font-family:inherit!important}[hidden]{display:none!important}
</style><main><header><span>关闭</span><h1>混合练习</h1><span>同步草稿</span></header><article class="card"><div class="meta"><strong>2 · 判断题</strong><span class="muted">基础</span></div><p class="muted">加权平均与组别权重</p><h2>判断下述说法：把一种钟在东港和西港的两个成功率直接相加后除以 2，就一定能得到该钟的总体成功率。</h2><hr><fieldset><legend>你的作答</legend><label class="choice"><input type="radio" name="answer" value="T">正确</label><label class="choice"><input type="radio" name="answer" value="F">错误</label></fieldset><section class="hint"><button id="toggle" aria-expanded="false" aria-controls="hint-content"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M9 18h6M10 21h4M8.5 15.5a6 6 0 1 1 7 0L15 18H9z"/></svg><span id="label">给我一点提示</span><span class="chevron" aria-hidden="true">⌄</span></button><div id="hint-content" hidden><p>先分别列出两港的成功次数和总次数，再想想：两个百分比是否代表同样多的样本？</p><p class="note">先试着往下做，答案不用急。</p></div><p id="note" class="note">给你一个切入点，不直接揭晓答案</p></section></article><p class="status" aria-live="polite" id="status">本机草稿已保存</p><p class="preview">交互设计预览 · 提示内容为人工示例，正式版随题生成。点击提示可展开、收起；收起不撤销已查看记录。</p></main><script>
const button=document.querySelector('#toggle');let seen=false;button.onclick=()=>{const open=button.getAttribute('aria-expanded')!=='true';seen=true;button.setAttribute('aria-expanded',String(open));document.querySelector('#hint-content').hidden=!open;document.querySelector('#label').textContent=open?'换个角度想想':'再看提示';document.querySelector('.chevron').textContent=open?'⌃':'⌄';document.querySelector('#note').textContent='已看提示 · 本题正常评分，不计入独立掌握度';document.querySelector('#status').textContent='已记录查看提示 · 作答内容保持不变';};
</script></html>
