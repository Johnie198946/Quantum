capabilities:
  - id: schedule.list
    version: 1.0.0
    domain: schedule
    description: Read the canonical task schedule for a tenant-visible QWS project.
    positive_examples: [Show this project's task schedule.]
    negative_examples: [Read another tenant's project schedule.]
    input_schema:
      type: object
      additionalProperties: false
      required: [project_id]
      properties:
        project_id: {type: string, minLength: 1, maxLength: 80}
    output_schema:
      type: object
      required: [schedule]
    effect: read
    risk: low
    confirmation: none
    preconditions: [authenticated_project_member]
    policy_ref: qws-schedule-access
    handler_binding: schedule.list
    idempotency: none
    receipt: none
    result_event: schedule.snapshot
    renderer: answer
    renderer_version: 1
    tests: [tests/test_schedule_capabilities.py]
    implementation_status: implemented
  - id: schedule.create
    version: 1.0.0
    domain: schedule
    description: Propose dates for one currently unscheduled canonical QWS task.
    positive_examples: [Schedule this unscheduled project task.]
    negative_examples: [Overwrite an existing schedule or skip confirmation.]
    input_schema: &schedule_write_input
      type: object
      additionalProperties: false
      required: [project_id, task_id, expected_revision, start_date, due_date]
      properties:
        project_id: {type: string, minLength: 1, maxLength: 80}
        task_id: {type: string, minLength: 1, maxLength: 80}
        expected_revision: {type: integer, minimum: 0}
        start_date: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
        due_date: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
    output_schema: &schedule_write_output
      type: object
      required: [proposal]
    effect: write
    risk: medium
    confirmation: required
    preconditions: [authenticated_project_writer, expected_project_revision, task_is_unscheduled]
    policy_ref: qws-schedule-access
    handler_binding: schedule.create
    idempotency: required
    receipt: required
    result_event: schedule.change_proposed
    renderer: answer
    renderer_version: 1
    tests: [tests/test_schedule_capabilities.py]
    implementation_status: implemented
  - id: schedule.update
    version: 1.0.0
    domain: schedule
    description: Propose replacement dates for one scheduled canonical QWS task.
    positive_examples: [Move this scheduled project task to new dates.]
    negative_examples: [Update a missing schedule or stale project revision.]
    input_schema: *schedule_write_input
    output_schema: *schedule_write_output
    effect: write
    risk: medium
    confirmation: required
    preconditions: [authenticated_project_writer, expected_project_revision, task_is_scheduled]
    policy_ref: qws-schedule-access
    handler_binding: schedule.update
    idempotency: required
    receipt: required
    result_event: schedule.change_proposed
    renderer: answer
    renderer_version: 1
    tests: [tests/test_schedule_capabilities.py]
    implementation_status: implemented
  - id: schedule.delete
    version: 1.0.0
    domain: schedule
    description: Propose clearing dates from one scheduled canonical QWS task.
    positive_examples: [Remove this task from the project schedule.]
    negative_examples: [Delete a missing schedule or bypass confirmation.]
    input_schema:
      type: object
      additionalProperties: false
      required: [project_id, task_id, expected_revision]
      properties:
        project_id: {type: string, minLength: 1, maxLength: 80}
        task_id: {type: string, minLength: 1, maxLength: 80}
        expected_revision: {type: integer, minimum: 0}
    output_schema: *schedule_write_output
    effect: write
    risk: medium
    confirmation: required
    preconditions: [authenticated_project_writer, expected_project_revision, task_is_scheduled]
    policy_ref: qws-schedule-access
    handler_binding: schedule.delete
    idempotency: required
    receipt: required
    result_event: schedule.change_proposed
    renderer: answer
    renderer_version: 1
    tests: [tests/test_schedule_capabilities.py]
    implementation_status: implemented
