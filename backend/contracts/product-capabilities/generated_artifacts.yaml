capabilities:
  - id: office.spreadsheet.create
    version: 1.0.0
    domain: generated_artifact
    description: Create an immutable XLSX artifact from bounded columns and rows.
    positive_examples: [Create a spreadsheet from this table.]
    negative_examples: [Claim an XLSX exists without a downloadable artifact hash.]
    input_schema:
      type: object
      additionalProperties: false
      required: [columns, rows]
      properties:
        title: {type: string, maxLength: 80}
        sheet_name: {type: string, maxLength: 31}
        columns: {type: array, minItems: 1, maxItems: 100}
        rows: {type: array, maxItems: 10000}
    output_schema: {type: object, required: [artifact_id, content_hash, byte_size, revision, download_path]}
    effect: write
    risk: medium
    confirmation: required
    preconditions: [authenticated_generated_artifact_owner, bounded_generation_input]
    policy_ref: generated-artifact-owner
    handler_binding: office.spreadsheet.create
    idempotency: required
    receipt: required
    result_event: artifact.generated
    renderer: artifact_card
    renderer_version: 1
    tests: [tests/test_generated_artifact_capabilities.py]
    implementation_status: implemented

  - id: office.pdf.create
    version: 1.0.0
    domain: generated_artifact
    description: Create an immutable PDF artifact from bounded text content.
    positive_examples: [Create a PDF from this text.]
    negative_examples: [Return a filename without valid PDF bytes.]
    input_schema:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        title: {type: string, maxLength: 80}
        content: {type: string, minLength: 1, maxLength: 200000}
    output_schema: {type: object, required: [artifact_id, content_hash, byte_size, revision, download_path]}
    effect: write
    risk: medium
    confirmation: required
    preconditions: [authenticated_generated_artifact_owner, bounded_generation_input]
    policy_ref: generated-artifact-owner
    handler_binding: office.pdf.create
    idempotency: required
    receipt: required
    result_event: artifact.generated
    renderer: artifact_card
    renderer_version: 1
    tests: [tests/test_generated_artifact_capabilities.py]
    implementation_status: implemented

  - id: data.analyze
    version: 1.0.0
    domain: generated_artifact
    description: Compute deterministic bounded column statistics and persist a JSON analysis artifact.
    positive_examples: [Analyze this dataset.]
    negative_examples: [Invent statistical conclusions from absent rows.]
    input_schema:
      type: object
      additionalProperties: false
      required: [columns, rows]
      properties:
        columns: {type: array, minItems: 1, maxItems: 100}
        rows: {type: array, maxItems: 100000}
    output_schema: {type: object, required: [artifact_id, content_hash, byte_size, revision, download_path, analysis]}
    effect: write
    risk: medium
    confirmation: required
    preconditions: [authenticated_generated_artifact_owner, bounded_generation_input]
    policy_ref: generated-artifact-owner
    handler_binding: data.analyze
    idempotency: required
    receipt: required
    result_event: artifact.generated
    renderer: data_analysis_card
    renderer_version: 1
    tests: [tests/test_generated_artifact_capabilities.py]
    implementation_status: implemented

  - id: media.create
    version: 1.0.0
    domain: generated_artifact
    description: Create a deterministic PNG media card from a bounded prompt and dimensions.
    positive_examples: [Create an image card with this message.]
    negative_examples: [Describe an image as generated without image bytes.]
    input_schema:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt: {type: string, minLength: 1, maxLength: 2000}
        width: {type: integer, minimum: 320, maximum: 2048}
        height: {type: integer, minimum: 320, maximum: 2048}
    output_schema: {type: object, required: [artifact_id, content_hash, byte_size, revision, download_path]}
    effect: write
    risk: medium
    confirmation: required
    preconditions: [authenticated_generated_artifact_owner, bounded_generation_input]
    policy_ref: generated-artifact-owner
    handler_binding: media.create
    idempotency: required
    receipt: required
    result_event: artifact.generated
    renderer: image_card
    renderer_version: 1
    tests: [tests/test_generated_artifact_capabilities.py]
    implementation_status: implemented
