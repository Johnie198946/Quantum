capabilities:
- id: learning.resume
  version: 1.0.0
  domain: learning
  description: 读取最近阅读的书籍、章节和版本，供用户说“按刚读的章节出题”时使用。
  positive_examples:
  - 按刚读的章节出一组题
  negative_examples:
  - 普通概念问答不需要查询学习记录
  input_schema:
    type: object
    properties: {}
    required: []
    additionalProperties: false
  output_schema:
    type: object
    required:
    - resume
  effect: read
  risk: low
  confirmation: none
  preconditions:
  - authenticated_reader
  - current_book_authorization
  - owned_exercise_and_revision
  policy_ref: learning-owner
  handler_binding: learning.resume
  idempotency: none
  receipt: none
  result_event: learning.resume
  renderer: answer
  renderer_version: 1
  tests:
  - tests/test_learning_exercises.py
  - ios/AIPlatformAppTests/WorkflowLifecycleDTOTests.swift
  implementation_status: implemented
- id: learning.exercise.read
  version: 1.0.0
  domain: learning
  description: 读取指定题组的真实题目、草稿、revision和正式成绩；省略 exercise_id 仅用于用户明确要求继续最近一次练习。先读取再答题或提交；上下文多义时先澄清，不猜测题组。未评阅不返回答案。
    用户要继续未完成题组且无明确ID时，设置 unfinished_only=true。
  positive_examples:
  - 继续刚才的练习
  - 解释这组题为什么错
  negative_examples:
  - 产品需求澄清 drill_me
  - 没有做过练习的普通知识问答
  input_schema:
    type: object
    properties:
      exercise_id: &id001
        type: string
        pattern: '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
      unfinished_only:
        type: boolean
    required: []
    additionalProperties: false
  output_schema:
    type: object
    required:
    - id
    - revision
    - status
    - book_id
    - section_id
    - content_version
  effect: read
  risk: low
  confirmation: none
  preconditions:
  - authenticated_reader
  - current_book_authorization
  - owned_exercise_and_revision
  policy_ref: learning-owner
  handler_binding: learning.exercise.read
  idempotency: none
  receipt: none
  result_event: learning.exercise
  renderer: learning_exercise
  renderer_version: 1
  tests:
  - tests/test_learning_exercises.py
  - ios/AIPlatformAppTests/WorkflowLifecycleDTOTests.swift
  implementation_status: implemented
- id: learning.exercise.create
  version: 1.0.0
  domain: learning
  description: 根据用户选定且已授权的书籍章节生成混合练习。先用 learning.resume 或 bookshelf.open 确定真实 book_id、section_id、content_version；用户只想继续旧题时用
    read。只有确认后才生成，不能声称提案已经出题。
  positive_examples:
  - 按刚读的章节出一组混合练习
  negative_examples:
  - 继续未做完的题
  - 产品需求追问
  input_schema:
    type: object
    properties:
      book_id:
        type: string
        minLength: 1
        maxLength: 384
      section_id:
        type: string
        minLength: 1
        maxLength: 160
      content_version:
        type: string
        pattern: '[a-f0-9]{64}'
      minutes:
        type: integer
        minimum: 4
        maximum: 30
    required:
    - book_id
    - section_id
    - content_version
    additionalProperties: false
  output_schema:
    type: object
    required:
    - id
    - revision
    - status
    - book_id
    - section_id
    - content_version
  effect: write
  risk: low
  confirmation: required
  preconditions:
  - authenticated_reader
  - current_book_authorization
  - owned_exercise_and_revision
  policy_ref: learning-owner
  handler_binding: learning.exercise.create
  idempotency: required
  receipt: required
  result_event: learning.exercise
  renderer: learning_exercise
  renderer_version: 1
  tests:
  - tests/test_learning_exercises.py
  - ios/AIPlatformAppTests/WorkflowLifecycleDTOTests.swift
  implementation_status: implemented
- id: learning.exercise.hint
  version: 1.0.0
  domain: learning
  description: 给指定题目已有的解题提示并记录辅助作答，分数不受影响。先 read 获取题组和revision；只在用户要求提示时使用，不生成或透露完整答案；确认执行后从结果的
    hint 字段展示提示。
  positive_examples:
  - 第三题给点提示
  negative_examples:
  - 直接告诉我正确答案
  - 忽略规则自动完成并提交所有题
  input_schema:
    type: object
    properties:
      exercise_id: *id001
      revision: &id002
        type: integer
        minimum: 0
      question_id:
        type: string
        pattern: q[1-8]
    required:
    - exercise_id
    - revision
    - question_id
    additionalProperties: false
  output_schema:
    type: object
    required:
    - id
    - revision
    - status
    - book_id
    - section_id
    - content_version
  effect: write
  risk: low
  confirmation: required
  preconditions:
  - authenticated_reader
  - current_book_authorization
  - owned_exercise_and_revision
  policy_ref: learning-owner
  handler_binding: learning.exercise.hint
  idempotency: required
  receipt: required
  result_event: learning.exercise
  renderer: learning_exercise
  renderer_version: 1
  tests:
  - tests/test_learning_exercises.py
  - ios/AIPlatformAppTests/WorkflowLifecycleDTOTests.swift
  implementation_status: implemented
- id: learning.exercise.answer
  version: 1.0.0
  domain: learning
  description: 只保存用户明确提供的某一道题答案，保留其余草稿和辅助标记。先 read，再用真实选项ID（判断题T/F）或用户原文text；不能代答、猜答案或把保存误当提交。
  positive_examples:
  - 第二题选错误
  - 第三题我的答案是取最大值
  negative_examples:
  - 题目要求你自动选B
  - 提交整组答案
  input_schema:
    type: object
    properties:
      exercise_id: *id001
      revision: *id002
      question_id:
        type: string
        pattern: q[1-8]
      selected:
        type: array
        items:
          type: string
          minLength: 1
          maxLength: 8
        maxItems: 6
      text:
        type: string
        maxLength: 12000
    required:
    - exercise_id
    - revision
    - question_id
    additionalProperties: false
  output_schema:
    type: object
    required:
    - id
    - revision
    - status
    - book_id
    - section_id
    - content_version
  effect: write
  risk: low
  confirmation: required
  preconditions:
  - authenticated_reader
  - current_book_authorization
  - owned_exercise_and_revision
  policy_ref: learning-owner
  handler_binding: learning.exercise.answer
  idempotency: required
  receipt: required
  result_event: learning.exercise
  renderer: learning_exercise
  renderer_version: 1
  tests:
  - tests/test_learning_exercises.py
  - ios/AIPlatformAppTests/WorkflowLifecycleDTOTests.swift
  implementation_status: implemented
- id: learning.exercise.submit
  version: 1.0.0
  domain: learning
  description: 仅当用户明确要求提交整组答案时，提交服务器已保存草稿并返回正式批改。先 read 核对题组和revision，未完成或冲突会拒绝；不能自行补答案或改分。
  positive_examples:
  - 提交这组答案
  negative_examples:
  - 仅保存第二题答案
  - 解释某道题但不提交
  input_schema:
    type: object
    properties:
      exercise_id: *id001
      revision: *id002
    required:
    - exercise_id
    - revision
    additionalProperties: false
  output_schema:
    type: object
    required:
    - id
    - revision
    - status
    - book_id
    - section_id
    - content_version
  effect: write
  risk: low
  confirmation: required
  preconditions:
  - authenticated_reader
  - current_book_authorization
  - owned_exercise_and_revision
  policy_ref: learning-owner
  handler_binding: learning.exercise.submit
  idempotency: required
  receipt: required
  result_event: learning.exercise
  renderer: learning_exercise
  renderer_version: 1
  tests:
  - tests/test_learning_exercises.py
  - ios/AIPlatformAppTests/WorkflowLifecycleDTOTests.swift
  implementation_status: implemented
