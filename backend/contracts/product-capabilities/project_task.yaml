capabilities:
  - id: project.list
    version: 1.0.0
    domain: project
    description: List projects visible to the authenticated tenant member.
    positive_examples: [List my projects.]
    negative_examples: [List another tenant's projects.]
    input_schema:
      type: object
      additionalProperties: false
      required: []
      properties: {}
    output_schema:
      type: object
      required: [projects]
    effect: read
    risk: low
    confirmation: none
    preconditions: [authenticated_project_member]
    policy_ref: qws-project-access
    handler_binding: project.list
    idempotency: none
    receipt: none
    result_event: project.snapshot
    renderer: answer
    renderer_version: 1
    tests: [tests/test_project_task_capabilities.py]
    implementation_status: implemented
  - id: project.create
    version: 1.0.0
    domain: project
    description: Create an owned QWS project from the canonical IPD template.
    positive_examples: [Create a project for this goal.]
    negative_examples: [Create a project without user confirmation.]
    input_schema:
      type: object
      additionalProperties: false
      required: [name, goal]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        goal: {type: string, minLength: 1, maxLength: 4000}
        desired_outputs:
          type: array
          items: {type: string}
        inputs: {type: object}
        truth_mode: {type: string, enum: [PLANNED, REPLAY, SIMULATION]}
        resource_overrides: {type: object}
    output_schema:
      type: object
      required: [project_id, task_ids, template_version, created_at]
    effect: write
    risk: medium
    confirmation: required
    preconditions: [authenticated_project_owner]
    policy_ref: qws-project-access
    handler_binding: project.create
    idempotency: required
    receipt: required
    result_event: project.created
    renderer: answer
    renderer_version: 1
    tests: [tests/test_project_task_capabilities.py]
    implementation_status: implemented
  - id: project.open
    version: 1.0.0
    domain: project
    description: Open a tenant-visible QWS project snapshot.
    positive_examples: [Open this project.]
    negative_examples: [Open another tenant's project.]
    input_schema:
      type: object
      additionalProperties: false
      required: [project_id]
      properties:
        project_id: {type: string, minLength: 1, maxLength: 80}
    output_schema:
      type: object
      required: [project]
    effect: read
    risk: low
    confirmation: none
    preconditions: [authenticated_project_member]
    policy_ref: qws-project-access
    handler_binding: project.open
    idempotency: none
    receipt: none
    result_event: project.snapshot
    renderer: answer
    renderer_version: 1
    tests: [tests/test_project_task_capabilities.py]
    implementation_status: implemented
  - id: project.update
    version: 1.0.0
    domain: project
    description: Propose definition changes to an owned QWS project using revision CAS.
    positive_examples: [Update this project's name and goal.]
    negative_examples: [Overwrite a stale or cross-tenant project.]
    input_schema:
      type: object
      additionalProperties: false
      required: [project_id, expected_revision, name, goal]
      properties:
        project_id: {type: string, minLength: 1, maxLength: 80}
        expected_revision: {type: integer, minimum: 0}
        name: {type: string, minLength: 1, maxLength: 160}
        goal: {type: string, minLength: 1, maxLength: 4000}
        desired_outputs:
          type: array
          items: {type: string}
    output_schema:
      type: object
      required: [proposal]
    effect: write
    risk: medium
    confirmation: required
    preconditions: [authenticated_project_writer, expected_project_revision]
    policy_ref: qws-project-access
    handler_binding: project.update
    idempotency: required
    receipt: required
    result_event: project.change_proposed
    renderer: answer
    renderer_version: 1
    tests: [tests/test_project_task_capabilities.py]
    implementation_status: implemented
  - id: project.delete
    version: 1.0.0
    domain: project
    description: Archive an owned QWS project while preserving immutable audit history.
    positive_examples: [Archive this project after confirmation.]
    negative_examples: [Hard-delete project history or archive a stale project.]
    input_schema:
      type: object
      additionalProperties: false
      required: [project_id, expected_revision]
      properties:
        project_id: {type: string, minLength: 1, maxLength: 80}
        expected_revision: {type: integer, minimum: 0}
    output_schema:
      type: object
      required: [proposal, project]
    effect: write
    risk: high
    confirmation: required
    preconditions: [authenticated_project_owner, recent_interactive_authentication, expected_project_revision]
    policy_ref: qws-project-access
    handler_binding: project.delete
    idempotency: required
    receipt: required
    result_event: project.change_proposed
    renderer: answer
    renderer_version: 1
    tests: [tests/test_project_task_capabilities.py]
    implementation_status: implemented
  - id: task.list
    version: 1.1.0
    domain: task
    description: List canonical tasks in a tenant-visible QWS project.
    positive_examples: [List tasks in this project.]
    negative_examples: [List tasks from another tenant.]
    input_schema:
      type: object
      additionalProperties: false
      required: [project_id]
      properties:
        project_id: {type: string, minLength: 1, maxLength: 80}
        include_cleanup: {type: boolean}
    output_schema:
      type: object
      required: [project_id, process_revision, tasks]
    effect: read
    risk: low
    confirmation: none
    preconditions: [authenticated_project_member]
    policy_ref: qws-project-access
    handler_binding: task.list
    idempotency: none
    receipt: none
    result_event: task.snapshot
    renderer: answer
    renderer_version: 1
    tests: [tests/test_project_task_capabilities.py]
    implementation_status: implemented
  - id: task.create
    version: 1.0.0
    domain: task
    description: Propose a new canonical task in an owned QWS project.
    positive_examples: [Add a task to this project stage.]
    negative_examples: [Add a task without confirmation or a project revision.]
    input_schema:
      type: object
      additionalProperties: false
      required: [project_id, expected_revision, stage_id, title, summary]
      properties:
        project_id: {type: string, minLength: 1, maxLength: 80}
        expected_revision: {type: integer, minimum: 0}
        stage_id: {type: string, minLength: 1, maxLength: 48}
        title: {type: string, minLength: 1, maxLength: 160}
        summary: {type: string, minLength: 1, maxLength: 4000}
        assignee_role: {type: string, maxLength: 160}
    output_schema:
      type: object
      required: [proposal, task_preview]
    effect: write
    risk: medium
    confirmation: required
    preconditions: [authenticated_project_owner, expected_project_revision]
    policy_ref: qws-project-access
    handler_binding: task.create
    idempotency: required
    receipt: required
    result_event: task.change_proposed
    renderer: answer
    renderer_version: 1
    tests: [tests/test_project_task_capabilities.py]
    implementation_status: implemented
  - id: task.update
    version: 1.1.0
    domain: task
    description: Update a canonical task contract; alternatively apply an explicitly confirmed batch of archive, restore or merge operations at one project revision.
    positive_examples: ["归档待办", "合并重复待办", "恢复待办", "Update this task title and summary."]
    negative_examples: [Overwrite a stale or cross-tenant task.]
    input_schema:
      type: object
      additionalProperties: false
      required: [project_id, expected_revision]
      properties:
        project_id: {type: string, minLength: 1, maxLength: 80}
        task_id: {type: string, minLength: 1, maxLength: 80}
        expected_revision: {type: integer, minimum: 0}
        stage_id: {type: string, minLength: 1, maxLength: 48}
        title: {type: string, minLength: 1, maxLength: 160}
        summary: {type: string, minLength: 1, maxLength: 4000}
        assignee_role: {type: string, maxLength: 160}
        operations:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [action, task_id]
            properties:
              action: {type: string, enum: [ARCHIVE, RESTORE, MERGE, REVERT_MERGE]}
              task_id: {type: string, minLength: 1, maxLength: 80}
              secondary_task_id: {type: string, minLength: 1, maxLength: 80}
              merge_id: {type: string, minLength: 1, maxLength: 80}
              field_choices: {type: object}

    output_schema:
      type: object
      required: [proposal, task_preview]
    effect: write
    risk: medium
    confirmation: required
    preconditions: [authenticated_project_writer, expected_project_revision]
    policy_ref: qws-project-access
    handler_binding: task.update
    idempotency: required
    receipt: required
    result_event: task.change_proposed
    renderer: answer
    renderer_version: 1
    tests: [tests/test_project_task_capabilities.py]
    implementation_status: implemented
  - id: task.status
    version: 1.0.0
    domain: task
    description: Read a canonical QWS task and its current status.
    positive_examples: [Show this task status.]
    negative_examples: [Read a task outside my tenant.]
    input_schema:
      type: object
      additionalProperties: false
      required: [project_id, task_id]
      properties:
        project_id: {type: string, minLength: 1, maxLength: 80}
        task_id: {type: string, minLength: 1, maxLength: 80}
    output_schema:
      type: object
      required: [task]
    effect: read
    risk: low
    confirmation: none
    preconditions: [authenticated_project_member]
    policy_ref: qws-project-access
    handler_binding: task.status
    idempotency: none
    receipt: none
    result_event: task.snapshot
    renderer: answer
    renderer_version: 1
    tests: [tests/test_project_task_capabilities.py]
    implementation_status: implemented
  - id: task.delete
    version: 1.1.0
    domain: task
    description: Soft-delete a canonical QWS task through the governed archive proposal path.
    positive_examples: [Delete this task from the active project plan.]
    negative_examples: [Hard-delete task audit history or delete with a stale revision.]
    input_schema:
      type: object
      additionalProperties: false
      required: [project_id, task_id, expected_revision]
      properties:
        project_id: {type: string, minLength: 1, maxLength: 80}
        task_id: {type: string, minLength: 1, maxLength: 80}
        expected_revision: {type: integer, minimum: 0}
    output_schema:
      type: object
      required: [proposal, task_preview]
    effect: write
    risk: high
    confirmation: required
    preconditions: [authenticated_project_writer, expected_project_revision]
    policy_ref: qws-project-access
    handler_binding: task.delete
    idempotency: required
    receipt: required
    result_event: task.change_proposed
    renderer: answer
    renderer_version: 1
    tests: [tests/test_project_task_capabilities.py]
    implementation_status: implemented

  - id: task.execute
    version: 1.0.0
    domain: task
    description: Queue an owner-bound QWS task conversation using an ephemeral delegated user token.
    positive_examples: [Execute this confirmed task now.]
    negative_examples: [Persist the client bearer in a durable Gateway invocation.]
    input_schema:
      type: object
      additionalProperties: false
      required: [conversation_id, task_id, expected_intent_hash, instruction]
      properties:
        conversation_id: {type: string, minLength: 8, maxLength: 80}
        task_id: {type: string, minLength: 1, maxLength: 40}
        expected_intent_hash: {type: string, minLength: 64, maxLength: 64}
        instruction: {type: string, minLength: 1, maxLength: 12000}
    output_schema:
      type: object
      required: [request_id, state, conversation_id, task_id, intent_hash, delegated_token_persisted]
    effect: execute
    risk: high
    confirmation: required
    preconditions: [authenticated_project_writer, confirmed_project_intent, expected_task_and_intent_cas]
    policy_ref: qws-project-access
    handler_binding: task.execute
    idempotency: required
    receipt: required
    result_event: task.execution_queued
    renderer: task_execution_card
    renderer_version: 1
    tests: [tests/test_task_execute_capability.py]
    implementation_status: implemented
