agent_descriptions:
  main_agent:
    function: 拆解目标、编排已注册能力并汇总交付结果
    suitable: 跨步骤任务、方案整理与进度协调
    boundary: 只调用获授权能力；写入和执行须确认
  supervision:
    function: 审查方案、风险、证据与验收条件
    suitable: 架构评审、质量把关与发布前检查
    boundary: 不代替执行者修改或发布；结论需证据
  coder:
    function: 按批准方案实现代码、修复问题并运行测试
    suitable: 明确范围的软件开发、调试与自动化验证
    boundary: 不绕过权限或确认；生产发布需另行授权
  knowledge:
    function: 检索、整理、入库并追溯授权知识
    suitable: 笔记查询、资料归纳与可追溯知识任务
    boundary: 仅访问当前账号范围；未核实内容会标注

