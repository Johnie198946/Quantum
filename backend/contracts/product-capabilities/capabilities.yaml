    idempotency: required
    receipt: required
    result_event: document.created
    renderer: workflow
    renderer_version: 1
    workflow_contract:
      format: {extension: docx, mime_type: application/vnd.openxmlformats-officedocument.wordprocessingml.document}
      required_sections: [governed_heading_hierarchy, editable_body]
      citations: {supported: [none, footnotes, apa7, mla9, chicago_author_date, gbt7714], fabricated_sources: forbidden}
      confirmation_points: [qcp_invocation, requirement_summary, plan, outline, content, final_output]
      delivery: {version: required, content_hash: required, download: authenticated}
    tests: [tests/test_product_capabilities.py, tests/test_document_presentation.py, tests/e2e/test_word_workflow.py]
