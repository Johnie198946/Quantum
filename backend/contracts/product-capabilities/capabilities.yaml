        citation_style: {type: string, enum: [none, footnotes, apa7, mla9, chicago_author_date, gbt7714], default: none}
        evidence_policy: {type: string, enum: [user_material_only, verified_public_sources], default: verified_public_sources}
        clarification_strategy: {type: string, enum: [use_defaults_unless_blocked, ask_before_planning], default: use_defaults_unless_blocked}
