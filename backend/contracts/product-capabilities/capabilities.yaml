    idempotency: required
    receipt: required
    result_event: document.created
    renderer: workflow
    renderer_version: 1
    workflow_contract:
      format: {extension: docx, mime_type: application/vnd.openxmlformats-officedocument.wordprocessingml.document}
      required_sections: [research_question, method, evidence, analysis, findings, limitations, recommendations, references]
      citations: {required: true, fabricated_sources: forbidden, unresolved_sources: mark_for_verification}
      confirmation_points: [qcp_invocation, requirement_summary, plan, outline, content, final_output]
      delivery: {version: required, content_hash: required, download: authenticated}
    tests: [tests/test_product_capabilities.py, tests/test_document_presentation.py, tests/e2e/test_research_report_workflow.py]
