capabilities:
  - id: skill.list
    version: 1.0.0
    domain: skill
    description: List Skills visible in the authenticated tenant/user Hermes sandbox.
    positive_examples: [List my available Skills.]
    negative_examples: [List another user's private Skills.]
    input_schema:
      type: object
      additionalProperties: false
      required: []
      properties:
        owned_only: {type: boolean}
    output_schema:
      type: object
      required: [skills]
      properties:
        skills: {type: array}
    effect: read
    risk: low
    confirmation: none
    preconditions: [authenticated_skill_owner]
    policy_ref: tenant-skill-owner
    handler_binding: skill.list
    idempotency: none
    receipt: none
    result_event: skill.snapshot
    renderer: answer
    renderer_version: 1
    tests: [tests/test_skill_capabilities.py]
    implementation_status: implemented
  - id: skill.create
    version: 1.0.0
    domain: skill
    description: Create one governed Skill in the authenticated tenant/user Hermes sandbox.
    positive_examples: [Create this private tenant Skill after confirmation.]
    negative_examples: [Write a host-global Skill or skip routing governance.]
    input_schema:
      type: object
      additionalProperties: false
      required: [name, content]
      properties:
        name: {type: string, minLength: 1, maxLength: 80, pattern: '^[A-Za-z0-9_.-]+$'}
        content: {type: string, minLength: 1, maxLength: 200000}
    output_schema:
      type: object
      required: [name, sha256, scope, verified]
    effect: write
    risk: medium
    confirmation: required
    preconditions: [authenticated_skill_owner, governed_skill_content]
    policy_ref: tenant-skill-owner
    handler_binding: skill.create
    idempotency: required
    receipt: required
    result_event: skill.changed
    renderer: answer
    renderer_version: 1
    tests: [tests/test_skill_capabilities.py]
    implementation_status: implemented
  - id: skill.update
    version: 1.0.0
    domain: skill
    description: Replace one owned governed Skill in the authenticated tenant/user Hermes sandbox.
    positive_examples: [Update my private tenant Skill after confirmation.]
    negative_examples: [Modify a platform template or another user's Skill.]
    input_schema:
      type: object
      additionalProperties: false
      required: [name, content]
      properties:
        name: {type: string, minLength: 1, maxLength: 80, pattern: '^[A-Za-z0-9_.-]+$'}
        content: {type: string, minLength: 1, maxLength: 200000}
    output_schema:
      type: object
      required: [name, sha256, scope, verified]
    effect: write
    risk: medium
    confirmation: required
    preconditions: [authenticated_skill_owner, tenant_owned_skill, governed_skill_content]
    policy_ref: tenant-skill-owner
    handler_binding: skill.update
    idempotency: required
    receipt: required
    result_event: skill.changed
    renderer: answer
    renderer_version: 1
    tests: [tests/test_skill_capabilities.py]
    implementation_status: implemented
  - id: skill.delete
    version: 1.0.0
    domain: skill
    description: Delete one owned custom Skill from the authenticated tenant/user Hermes sandbox.
    positive_examples: [Delete my private tenant Skill after confirmation.]
    negative_examples: [Delete a platform template or another user's Skill.]
    input_schema:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 80, pattern: '^[A-Za-z0-9_.-]+$'}
    output_schema:
      type: object
      required: [deleted, name, verified]
    effect: write
    risk: medium
    confirmation: required
    preconditions: [authenticated_skill_owner, tenant_owned_skill]
    policy_ref: tenant-skill-owner
    handler_binding: skill.delete
    idempotency: required
    receipt: required
    result_event: skill.changed
    renderer: answer
    renderer_version: 1
    tests: [tests/test_skill_capabilities.py]
    implementation_status: implemented
