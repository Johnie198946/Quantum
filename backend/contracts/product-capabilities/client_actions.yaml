  - id: voice.transcribe
    version: 1.0.0
    domain: client_action
    description: Record audio on iOS and transcribe it through the authenticated fail-closed speech API.
    positive_examples: [Transcribe a voice note.]
    negative_examples: [Return an empty successful transcript when speech service is unavailable.]
    input_schema:
      type: object
      additionalProperties: false
      properties:
        max_seconds: {type: integer, minimum: 1, maximum: 300}
    output_schema: {type: object, required: [action_id, action_type, state, payload]}
    effect: client_action
    risk: medium
