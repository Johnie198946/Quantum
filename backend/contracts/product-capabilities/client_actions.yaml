    input_schema:
      type: object
      additionalProperties: false
      required: [source_id]
      properties:
        source_id: {type: string, minLength: 8, maxLength: 128}
    output_schema: {type: object, required: [action_id, action_type, state, payload]}
    effect: client_action
    risk: medium
