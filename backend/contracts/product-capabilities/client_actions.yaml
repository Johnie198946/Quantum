capabilities:
  - id: file.pick
    version: 1.0.0
    domain: client_action
    description: Ask the authenticated iOS client to present the native document picker.
    positive_examples: [Choose a file from this device.]
    negative_examples: [Read a server path or upload before the picker returns a receipt.]
    input_schema:
      type: object
      additionalProperties: false
      properties:
        allowed_types: {type: array, items: {type: string}, maxItems: 20}
        allows_multiple: {type: boolean}
    output_schema: {type: object, required: [action_id, action_type, state, payload]}
    effect: client_action
    risk: medium
    confirmation: required
    preconditions: [authenticated_client_action_owner, supported_native_action]
    policy_ref: client-action-owner
    handler_binding: file.pick
    idempotency: required
    receipt: required
    result_event: client.action.requested
    renderer: client_action
    renderer_version: 1
    tests: [tests/test_client_action_capabilities.py]
    implementation_status: implemented

  - id: photo.capture
    version: 1.0.0
    domain: client_action
    description: Ask the authenticated iOS client to present the camera and return a client receipt.
    positive_examples: [Take a photo.]
    negative_examples: [Claim a photo exists before the camera receipt.]
    input_schema:
      type: object
      additionalProperties: false
      properties:
        camera: {type: string, enum: [rear, front]}
    output_schema: {type: object, required: [action_id, action_type, state, payload]}
    effect: client_action
    risk: high
    confirmation: required
    preconditions: [authenticated_client_action_owner, supported_native_action]
    policy_ref: client-action-owner
    handler_binding: photo.capture
    idempotency: required
    receipt: required
    result_event: client.action.requested
    renderer: client_action
    renderer_version: 1
    tests: [tests/test_client_action_capabilities.py]
    implementation_status: implemented

  - id: photo.import
    version: 1.0.0
    domain: client_action
    description: Ask the authenticated iOS client to present the photo library picker.
    positive_examples: [Import two photos.]
    negative_examples: [Read the whole photo library without user selection.]
    input_schema:
      type: object
      additionalProperties: false
      properties:
        selection_limit: {type: integer, minimum: 1, maximum: 20}
    output_schema: {type: object, required: [action_id, action_type, state, payload]}
    effect: client_action
    risk: high
    confirmation: required
    preconditions: [authenticated_client_action_owner, supported_native_action]
    policy_ref: client-action-owner
    handler_binding: photo.import
    idempotency: required
    receipt: required
    result_event: client.action.requested
    renderer: client_action
    renderer_version: 1
    tests: [tests/test_client_action_capabilities.py]
    implementation_status: implemented

  - id: voice.record
    version: 1.0.0
    domain: client_action
    description: Ask the authenticated iOS client to present the native voice recorder.
    positive_examples: [Record a voice note for thirty seconds.]
    negative_examples: [Start the microphone without confirmation or claim success before receipt.]
    input_schema:
      type: object
      additionalProperties: false
      properties:
        max_seconds: {type: integer, minimum: 1, maximum: 600}
    output_schema: {type: object, required: [action_id, action_type, state, payload]}
    effect: client_action
    risk: high
    confirmation: required
    preconditions: [authenticated_client_action_owner, supported_native_action]
    policy_ref: client-action-owner
    handler_binding: voice.record
    idempotency: required
    receipt: required
    result_event: client.action.requested
    renderer: client_action
    renderer_version: 1
    tests: [tests/test_client_action_capabilities.py]
    implementation_status: implemented

  - id: share.present
    version: 1.0.0
    domain: client_action
    description: Ask the authenticated iOS client to present the native share sheet for supplied text or an owned artifact.
    positive_examples: [Share this result.]
    negative_examples: [Report sharing completed before the share-sheet receipt.]
    input_schema:
      type: object
      additionalProperties: false
      properties:
        text: {type: string, maxLength: 20000}
        artifact_id: {type: string, maxLength: 128}
    output_schema: {type: object, required: [action_id, action_type, state, payload]}
    effect: client_action
    risk: medium
    confirmation: required
    preconditions: [authenticated_client_action_owner, supported_native_action]
    policy_ref: client-action-owner
    handler_binding: share.present
    idempotency: required
    receipt: required
    result_event: client.action.requested
    renderer: client_action
    renderer_version: 1
    tests: [tests/test_client_action_capabilities.py]
    implementation_status: implemented
