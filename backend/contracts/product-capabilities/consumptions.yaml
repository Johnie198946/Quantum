consumptions:
  - id: knowledge.natural_qa
    kind: knowledge
    description: Natural-language QA consumes only policy-scoped knowledge evidence through Hermes.
    input_contract: {question: string, knowledge_scope: authorized_list}
    receipt: durable_answer_and_source_events
    implementation_refs: [backend/api/chat.py, scripts/hermes_bridge.py]
    gates: [backend/api/knowledge_policy.py, backend/services/knowledge_policy.py]
    status: implemented
  - id: workflow.knowledge_need_injection
    kind: workflow
    description: Workflow KnowledgeNeed maps to existing KNOWLEDGE_RETRIEVAL nodes and a server-minted scoped capability.
    input_contract: {knowledge_need: workflow_node_parameters, injection: execution_payload}
    receipt: workflow_event_receipt
    implementation_refs: [backend/services/workflow_planner.py, backend/services/workflow_executor.py]
    gates: [backend/services/knowledge_policy.py, backend/services/workflow_contract.py]
    status: implemented
  - id: artifact.structured_consumption
    kind: artifact
    description: QCP consumes only owned, hash-matched JSON workflow artifacts through the Hermes runtime and persists a verified idempotent receipt.
    input_contract: {execution_id: string, artifact_id: string, expected_content_hash: sha256, expected_schema: optional_restricted_json_schema}
    receipt: durable_structured_consumption_receipt
    implementation_refs: [backend/services/artifact_consumption.py, backend/capability_handlers.py, scripts/hermes_bridge.py]
    gates: [workflow_creator, dirfd_verified_artifact, stable_trusted_idempotency_key]
    status: implemented

  - id: publication.illustrated_delivery
    kind: publication
    description: Existing publication loop dispatches content then planned illustration preparation, independent signed review and due release; bookshelf consumers render authenticated media from the same frozen edition. Manual generation is not unattended acceptance.
    input_contract: {series: enabled_registry_entry, occurrence: program_bound_issue_key, content: publication-content-v1, media: two_covers_and_reviewed_illustration_plan, reader: authenticated_same_publication}
    receipt: native_dispatch_and_generation_evidence_signed_review_edition_and_reader_media_readback
    implementation_refs: [scripts/publication_scheduler_watchdog.py, scripts/publication_workflow_handoff.py, scripts/publication_editorial_remote.py, backend/services/knowledge_publication_store.py, backend/api/subscriptions.py, ios/AIPlatformApp/Networking/APIClient.swift, ios/AIPlatformApp/Views/Settings/SettingsView.swift, docs/runbooks/publication-standard-workflow.md]
    gates: [configured_role_binding, frozen_author_content, bounded_material_claim, all_planned_media_receipts, independent_native_review_proof, due_release, authenticated_reader_media, client_visible_images]
    status: partial
