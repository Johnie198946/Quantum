capabilities:
  - id: workflow.approve
    version: 1.0.0
    domain: workflow
    description: Approve the exact current workflow plan through the existing lifecycle handler.
    positive_examples: ["Approve this reviewed workflow plan"]
    negative_examples: ["Approve a stale or another user's plan"]
    input_schema: {type: object, properties: {workflow_id: {type: string, minLength: 1, maxLength: 48}, expected_plan_hash: {type: string, minLength: 64, maxLength: 64, pattern: '^[0-9a-f]{64}$'}, expected_plan_revision: {type: integer, minimum: 1}, comment: {type: string, maxLength: 2000}}, required: [workflow_id, expected_plan_hash, expected_plan_revision], additionalProperties: false}
    output_schema: {type: object, required: [workflow, agent]}
    effect: write
    risk: high
    confirmation: required
    preconditions: [authenticated_owner, awaiting_plan_approval, plan_revision_cas]
    policy_ref: workflow-owner
    handler_binding: workflow.approve
    idempotency: required
    receipt: required
    result_event: workflow.approved
    renderer: workflow
    renderer_version: 1
    tests: [tests/test_workflow_capabilities.py, tests/test_workflows_api.py]
    implementation_status: implemented
  - id: workflow.revise
    version: 1.0.0
    domain: workflow
    description: Save a CAS-bound workflow plan revision through the existing versioned plan editor.
    positive_examples: ["Revise this workflow plan before approval"]
    negative_examples: ["Overwrite a stale or already executing plan"]
    input_schema:
      type: object
      properties:
        workflow_id: {type: string, minLength: 1, maxLength: 48}
        dsl: {type: object}
        deliverable: {type: string, minLength: 1, maxLength: 300}
        allow_network: {type: boolean}
        max_tokens: {type: integer, minimum: 1000, maximum: 999999}
        knowledge_scope: {type: array, items: {type: string}}
        expected_plan_hash: {type: string, minLength: 64, maxLength: 64, pattern: '^[0-9a-f]{64}$'}
        expected_plan_revision: {type: integer, minimum: 1}
      required: [workflow_id, dsl, deliverable, expected_plan_hash, expected_plan_revision]
      additionalProperties: false
    output_schema: {type: object, required: [id, workflow_id, version, content_hash, activation_revision]}
    effect: write
    risk: high
    confirmation: required
    preconditions: [authenticated_owner, editable_plan, plan_revision_cas]
    policy_ref: workflow-owner
    handler_binding: workflow.revise
    idempotency: required
    receipt: required
    result_event: workflow.revised
    renderer: workflow
    renderer_version: 1
    tests: [tests/test_workflow_capabilities.py, tests/test_workflows_api.py]
    implementation_status: implemented
