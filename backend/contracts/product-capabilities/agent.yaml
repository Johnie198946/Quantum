capabilities:
- id: agent.list
  version: 1.0.0
  domain: agent
  description: List tenant-visible agents.
  positive_examples:
  - List tenant-visible agents.
  negative_examples:
  - other tenant data
  input_schema:
    type: object
    additionalProperties: false
    required: []
    properties:
      owned_only: &id002
        type: boolean
  output_schema:
    type: object
    required:
    - agents
  effect: read
  risk: low
  confirmation: none
  preconditions:
  - authenticated_owner
  policy_ref: agent-owner
  handler_binding: agent.list
  idempotency: none
  receipt: none
  result_event: agent.snapshot
  renderer: answer
  renderer_version: 1
  tests:
  - tests/test_agent_capabilities.py
  implementation_status: implemented
