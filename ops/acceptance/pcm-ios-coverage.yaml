version: 2
scope: ios-all-capabilities-gate-3-6
status_values:
- implemented
- partial
- absent
- unverified
rule: A capability is implemented only when every registry and iOS/QWS consumption link is evidenced. The three governed document-product
  capabilities additionally require a clean-room production workflow with artifact id, version, SHA-256 and repeated authenticated
  download; the other 67 capabilities require an authenticated production describe receipt matched to the local PCM event
  and renderer contract.
